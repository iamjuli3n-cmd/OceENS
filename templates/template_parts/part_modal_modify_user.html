<!-- Modal -->

<style>
    /* ════════════════════════════════════════
   MODAL
   ════════════════════════════════════════ */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 10, 30, .45);
        backdrop-filter: blur(3px);
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s;
    }

    .modal-overlay.open {
        opacity: 1;
        pointer-events: all;
    }

    .modal {
        background: white;
        border-radius: 14px;
        width: 100%;
        max-width: 670px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
        transform: translateY(20px) scale(.97);
        transition: transform .25s;
        /*max-height: 90vh;*/
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .modal-overlay.open .modal {
        transform: translateY(0) scale(1);
    }

    .modal-header {
        background: linear-gradient(135deg, var(--purple), var(--purple-mid));
        padding: 22px 24px 18px;
        color: white;
        flex-shrink: 0;
    }

    .modal-header h3 {
        font-size: 1.05rem;
        font-weight: 600;
    }

    .modal-header p {
        font-size: .82rem;
        opacity: .75;
        margin-top: 4px;
    }

    .modal-body {
        padding: 24px;
        overflow-y: auto;
        flex: 1;
    }

    .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-shrink: 0;
    }

    /* ── Role options ── */
    .role-select-label {
        font-size: .82rem;
        font-weight: 600;
        color: var(--blue-label);
        margin-bottom: 10px;
        display: block;
    }

    .role-options {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .role-option {
        flex: 1;
        min-width: 100px;
        padding: 12px 8px;
        border: 2px solid var(--border);
        border-radius: 10px;
        text-align: center;
        cursor: pointer;
        transition: all .2s;
        user-select: none;
    }

    .role-option:hover {
        border-color: var(--purple-light);
        background: #faf7ff;
    }

    .role-option.selected {
        border-color: var(--purple);
        background: #f3eeff;
    }

    .ro-icon {
        font-size: 1.4rem;
        margin-bottom: 4px;
    }

    .ro-name {
        font-size: .8rem;
        font-weight: 600;
        color: var(--text);
    }

    /* ════════════════════════════════════════
   SECTION FILIÈRES RP-RM
   ════════════════════════════════════════ */
    .rprm-formations-section {
        display: none;
        /* caché par défaut */
        margin-top: 4px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        animation: fadeInDown .2s ease;
    }

    .rprm-formations-section.visible {
        display: block;
        /* affiché quand RP-RM sélectionné */
    }

    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-6px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .rprm-section-title {
        font-size: .82rem;
        font-weight: 600;
        color: var(--blue-label);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .rprm-section-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    /* Tags */
    .formations-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
        min-height: 32px;
        align-items: flex-start;
    }

    .formations-empty-hint {
        font-size: .78rem;
        color: #b0bec5;
        font-style: italic;
        align-self: center;
    }

    .formation-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #ede7f6;
        color: #4527a0;
        border: 1px solid #c5b8e8;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: .78rem;
        font-weight: 600;
        animation: tagIn .15s ease;
    }

    @keyframes tagIn {
        from {
            opacity: 0;
            transform: scale(.85);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    .formation-tag-remove {
        background: none;
        border: none;
        cursor: pointer;
        color: #4527a0;
        font-size: 15px;
        line-height: 1;
        padding: 0;
        opacity: .5;
        transition: opacity .2s;
    }

    .formation-tag-remove:hover {
        opacity: 1;
    }

    /* Dropdown row */
    .formations-select-row {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .formations-select {
        flex: 1;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: .88rem;
        font-family: 'DM Sans', sans-serif;
        color: var(--text);
        background: var(--bg);
        cursor: pointer;
        transition: border-color .2s;
    }

    .formations-select:focus {
        outline: none;
        border-color: var(--purple);
        box-shadow: 0 0 0 3px rgba(71, 10, 104, .1);
        background: white;
    }

    .btn-add-formation {
    padding: 9px 16px;
    background: linear-gradient(135deg, var(--purple), var(--purple-mid));
    color: white;
    border: none;
    border-radius: 8px;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all .2s;
    white-space: nowrap;
}

.btn-add-formation:hover {
    background: linear-gradient(135deg, var(--purple-mid), var(--purple-light));
}

    

   

    
</style>
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">Modifier le rôle</h3>
            <p id="modal-subtitle">Choisissez un rôle pour cet utilisateur</p>
        </div>

        <div class="modal-body">
            <span class="role-select-label">Quel est son rôle ?</span>
            <div class="role-options">

                <div class="role-option" data-role="student">
                    <input type="checkbox" value="student" id="role-option-student" disabled /> <label class="ro-name"
                        for="role-option-student">Étudiant</label>
                </div>
                <div class="role-option" data-role="admin">
                    <input type="checkbox" value="admin" id="role-option-admin" /> <label class="ro-name"
                        for="role-option-admin">Admin</label>
                </div>
                <div class="role-option" data-role="program_manager">
                    <input type="checkbox" value="program_manager" id="role-option-program-manager" /> <label
                        class="ro-name" for="role-option-program-manager">RPRM</label>
                </div>
                <div class="role-option" data-role="facilitator">
                    <input type="checkbox" value="facilitator" id="role-option-facilitator" /> <label class="ro-name"
                        for="role-option-facilitator">Animateur</label>
                </div>
            </div>

            <!-- Section formations RP-RM -->
            <div class="rprm-formations-section" id="rprm-formations-section">
                <div class="rprm-section-title">Formations associées aux RPRMs</div>

                <!-- Tags des formations sélectionnées -->
                <div class="formations-tags" id="formations-tags"></div>

                <!-- Dropdown + bouton ajouter -->
                <div class="formations-select-row">
                    <select class="formations-select" id="formations-select">
                        <option value="">-- Sélectionner une formation --</option>
                        {% for program in programs %}
                        <option value="{{program.code}}"> {{program.name}} ({{program.campus}})</option>
                        {% endfor %}
                    </select>
                                        <button class="btn-add-formation" id="btn-add-formation" onclick="addNewProgram()">Ajouter</button>
                </div>
            </div>

            <!-- Section formations Animateurs -->
            <div class="rprm-formations-section" id="rprm-formations-facilitator-section">
                <div class="rprm-section-title">Formations associées aux Animateurs</div>

                <!-- Tags des formations sélectionnées -->
                <div class="formations-tags" id="formations-facilitator-tags"></div>

                <!-- Dropdown + bouton ajouter -->
                <div class="formations-select-row">
                    <select class="formations-select" id="formations-facilitator-select">
                        <option value="">-- Sélectionner une formation --</option>
                        {% for program in programs %}
                        <option value="{{program.code}}"> {{program.name}} ({{program.campus}})</option>
                        {% endfor %}
                    </select>
                    <button class="btn-add-formation" id="btn-add-formation" onclick="addNewFacilitatorProgram()">Ajouter</button>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel" id="btn-cancel" onclick="closeModal()">Annuler</button>
            <button class="btn-save" id="btn-save" onclick="putNewRole()">Enregistrer</button>
        </div>
    </div>
</div>

<script>

    function checkStudent() {
        console.log("CHECKSTUDENT");
        document.getElementById("role-option-student").checked = !(document.getElementById("role-option-admin").checked || document.getElementById("role-option-program-manager").checked || document.getElementById("role-option-facilitator").checked)
    }



    var selectedPrograms = []; // filières choisies pour le RP-RM en cours d'édition
    var selectedFacilitatorPrograms = []; // filières choisies pour l'animateur en cours d'édition


    // ── Ouvrir la modale ────────────────────────────
    function openModal(userId) {
        var users = {{ users | tojson | safe
    }};
    var user = users.find(u => u.user_id === userId);
    console.log("User found:", user);

    if (!user) return;

    editingUser = user;

    document.getElementById("role-option-admin").checked = false;
    document.getElementById("role-option-program-manager").checked = false;
    document.getElementById("role-option-facilitator").checked = false;

    user.roles.forEach(role => {
        if (role.startsWith("admin")) {
            document.getElementById("role-option-admin").checked = true;
        }
        if (role.startsWith("program_manager")) {
            document.getElementById("role-option-program-manager").checked = true;
            if (role.includes(":"))
                selectedPrograms.push(role.split(":")[1])
        }
        if (role.startsWith("facilitator")) {
            document.getElementById("role-option-facilitator").checked = true;
            if (role.includes(":"))
                selectedFacilitatorPrograms.push(role.split(":")[1])
        }


    })

    // Header
    document.getElementById('modal-title').textContent = user.name;
    document.getElementById('modal-subtitle').textContent = user.mail;

    renderProgramTags();

    // Réactiver le bouton save
    var btnSave = document.getElementById('btn-save');
    btnSave.disabled = false;
    btnSave.textContent = 'Enregistrer';

    // Ouvrir
    document.getElementById('modal-overlay').classList.add('open');
    }

    // ── Section filières : afficher/masquer ─────────
    function showProgramSection() {
        document.getElementById('rprm-formations-section').classList.add('visible');
    }
    function hideProgramSection() {
        document.getElementById('rprm-formations-section').classList.remove('visible');
    }
    function showFacilitatorProgramSection() {
        document.getElementById('rprm-formations-facilitator-section').classList.add('visible');
    }
    function hideFacilitatorProgramSection() {
        document.getElementById('rprm-formations-facilitator-section').classList.remove('visible');
    }

    // ── Rendu des tags filières ──────────────────────
    function renderProgramTags() {
        var container = document.getElementById('formations-tags');
        if (selectedPrograms.length === 0) {
            container.innerHTML = '<span class="formations-empty-hint">Aucune filière ajoutée</span>';
            return;
        }
        container.innerHTML = selectedPrograms.map(function (f) {
            return '<span class="formation-tag">'
                + f
                + '<button class="formation-tag-remove" data-filiere="' + f + '" title="Retirer">×</button>'
                + '</span>';
        }).join('');

        container.querySelectorAll('.formation-tag-remove').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                var nom = btn.dataset.filiere;
                selectedPrograms = selectedPrograms.filter(function (f) { return f !== nom; });
                renderProgramTags();
            });
        });
    }

    // ── Rendu des tags filières ──────────────────────
    function renderFacilitatorProgramTags() {
        var container = document.getElementById('formations-facilitator-tags');
        if (selectedFacilitatorPrograms.length === 0) {
            container.innerHTML = '<span class="formations-empty-hint">Aucune filière ajoutée</span>';
            return;
        }
        container.innerHTML = selectedFacilitatorPrograms.map(function (f) {
            return '<span class="formation-tag">'
                + f
                + '<button class="formation-tag-remove" data-filiere="' + f + '" title="Retirer">×</button>'
                + '</span>';
        }).join('');

        container.querySelectorAll('.formation-facilitator-tag-remove').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                var nom = btn.dataset.filiere;
                selectedFacilitatorPrograms = selectedFacilitatorPrograms.filter(function (f) { return f !== nom; });
                renderFacilitatorProgramTags();
            });
        });
    }




    // ── Fermer la modale ────────────────────────────
    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('open');
        editingUserId = null;
        selectedPrograms = [];
        selectedFacilitatorPrograms = [];
    }

    function buildRoles() {
        roles= new Set()
        if (document.getElementById("role-option-admin").checked) {
            roles.add("admin")
        }
        if (document.getElementById("role-option-program-manager").checked) {
            selectedPrograms.forEach(program=> {
                roles.add("program_manager:"+program)
            })
        }
        if(document.getElementById("role-option-facilitator").checked) {
            selectedFacilitatorPrograms.forEach(program=> {
                roles.add("facilitator:"+program)
            })
        }
        return Array.from(roles);
    }

    // CODE A EXECUTER AU CHARGEMENT DE LA PAGE
    document.addEventListener('DOMContentLoaded', function () {

        // Student is the option if no other are selected
        document.getElementById("role-option-student").addEventListener("change", checkStudent);
        document.getElementById("role-option-admin").addEventListener("change", checkStudent);
        document.getElementById("role-option-program-manager").addEventListener("change", checkStudent);
        document.getElementById("role-option-facilitator").addEventListener("change", checkStudent);
        checkStudent();

        // ── Sélection du rôle dans la modale ────────────
        document.querySelectorAll('.role-option').forEach(function (opt) {
            opt.addEventListener('click', function () {
                document.querySelectorAll('.role-option').forEach(function (o) { o.classList.remove('selected'); });
                opt.classList.add('selected');
                editingUser["role"] = opt.dataset.role;

                if (opt.dataset.role === 'program_manager') {
                    showProgramSection();
                    renderProgramTags();
                } else {
                    hideProgramSection();
                }
                if (opt.dataset.role === 'facilitator') {
                    showFacilitatorProgramSection();
                    renderFacilitatorProgramTags();
                } else {
                    hideFacilitatorProgramSection();
                }
            });
        });

    });

    // ── Sauvegarde ───────────────────────────────────
    function putNewRole() {

        if (!editingUser) return;



        // Construire le rôle final
        var roles = buildRoles()

        var btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Enregistrement…';

        fetch('/api/users/' + editingUser["user_id"] + '/role', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roles: roles })
        })
            .then(function (resp) {
                if (!resp.ok) {
                    return resp.json().catch(function () { return {}; }).then(function (err) {
                        throw new Error(err.detail || 'HTTP ' + resp.status);
                    });
                }
                return resp.json();
            })
            .then(function () {
                closeModal();
                showToast('Rôle de ' + editingUser["mail"] + ' mis à jour', 'success');
                window.location.reload(); // Recharger la page pour refléter les changements
            })
            .catch(function (err) {
                showToast('Erreur : ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Enregistrer';

            });
    };

    // ── Ajouter une filière depuis le dropdown ───────
    function addNewProgram() {
        var select = document.getElementById('formations-select');
        var val = select.value;
        if (!val) return;

        if (selectedPrograms.indexOf(val) === -1) {
            selectedPrograms.push(val);
            renderProgramTags();
        }
        select.value = '';
    };

    // ── Ajouter une filière depuis le dropdown ───────
    function addNewFacilitatorProgram() {
        var select = document.getElementById('formations-facilitator-select');
        var val = select.value;
        if (!val) return;

         if (selectedFacilitatorPrograms.indexOf(val) === -1) {
            selectedFacilitatorPrograms.push(val);
            renderFacilitatorProgramTags();
        }
        select.value = '';
    };

</script>
