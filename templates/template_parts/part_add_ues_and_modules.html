<script>
    const surveyPrefill = {{ survey_prefill | tojson }};
    var ues = surveyPrefill ? surveyPrefill.ues : [];
    var teachersList = {{ teachers_list | tojson }} || [];
    var nextUEId = ues.reduce((maxId, ue) => Math.max(maxId, Number(ue.id) || 0), 0);
    var nextModuleId = ues.reduce(
        (maxId, ue) => Math.max(
            maxId,
            ...(ue.modules || []).map(module => Number(module.id) || 0)
        ),
        0
    );
    var nextTeacherId = 0;

    function applySurveyPrefill() {
        if (!surveyPrefill) return;

        const fields = {
            'param-template': surveyPrefill.template_id,
            'param-filiere': surveyPrefill.program,
            'param-semestre': surveyPrefill.semester,
            //'param-annee': surveyPrefill.school_year,
        };

        Object.entries(fields).forEach(([fieldId, value]) => {
            const field = document.getElementById(fieldId);
            if (!field || value === null || value === undefined) return;

            const stringValue = String(value);
            if (fieldId === 'param-annee' && !Array.from(field.options).some(option => option.value === stringValue)) {
                field.add(new Option(stringValue, stringValue));
            }
            field.value = stringValue;
        });

        const syllabusTeachers = ues.flatMap(ue =>
            (ue.modules || []).flatMap(module => module.teachers || [])
        );
        teachersList = sortTeachers(
            [...new Set([...teachersList, ...syllabusTeachers])].filter(Boolean)
        );

        renderUEs();
    }

    document.addEventListener('DOMContentLoaded', applySurveyPrefill);

    // Util
    function esc(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    // Échappement pour usage dans un attribut HTML (ex: value="...")
    function escAttr(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    // ─── Tri des professeurs (accents, casse, espaces) ──
    // Équivalent JS de teacher_sort_key() côté Python (app.py), pour que le
    // tri reste cohérent entre le chargement initial (serveur) et les ajouts
    // faits en direct dans cette page.
    function teacherSortKey(name) {
        const normalized = String(name || '').normalize('NFD').toLowerCase();
        const withoutAccents = normalized.replace(/[\u0300-\u036f]/g, '');
        return withoutAccents.replace(/\s+/g, ' ').trim();
    }

    function sortTeachers(list) {
        return [...list].sort((a, b) => {
            const keyA = teacherSortKey(a);
            const keyB = teacherSortKey(b);
            if (keyA < keyB) return -1;
            if (keyA > keyB) return 1;
            return 0;
        });
    }

    function addUE() {
        selectedProgramId = document.getElementById("param-filiere").value
        if (!selectedProgramId) return;
        const newId = ++nextUEId;
        ues.push({
            id: newId,
            name: 'Nouvelle UE '+newId,
            filiere_id: selectedProgramId,
            _open: true,
            modules: []
        });
        renderUEs();
    }
    // ─── Render la liste des UE ─────────────────────────
    function renderUEs() {
        const container = document.getElementById('param-ue-container');
        if (!container) return;

        if (ues.length === 0) {
            container.innerHTML = `
                <p class="param-empty">Aucune UE pour cette filière.</p>
                <button class="param-btn-add param-btn-add-ue" onclick="addUE()">+ Ajouter une UE</button>
            `;
            return;
        }

        container.innerHTML = `
            <div class="param-ue-list">
                ${ues.map((ue, i) => renderUE(ue, i)).join('')}
            </div>
            <button class="param-btn-add param-btn-add-ue" onclick="addUE()">+ Ajouter une UE</button>
        `;
        initProfSelects();
    }

    // ─── Render une UE ──────────────────────────────────
    function renderUE(ue, index) {
        const isOpen = ue._open !== false;
        return `
            <div class="param-ue ${isOpen ? 'open' : ''}" data-ue-id="${ue.id}">
                <div class="param-ue-header" onclick="toggleUE(${ue.id})">
                    <span class="param-chevron"></span>
                    <span class="param-ue-name">
                        <input type="text" value="${esc(ue.name)}"
                               onclick="event.stopPropagation()"
                               onblur="renameUE(${ue.id}, this.value)"
                               onkeydown="if(event.key==='Enter'){this.blur();}">
                    </span>
                    <span class="param-ue-actions" onclick="event.stopPropagation()">
                        <button class="param-btn-remove" onclick="removeUE(${ue.id})" title="Supprimer l'UE">&times;</button>
                    </span>
                </div>
                <div class="param-ue-body">
                    <div class="param-module-list">
                        ${(ue.modules || []).map(m => renderModule(m, ue.id)).join('')}
                    </div>
                    <button class="param-btn-add" onclick="addModule(${ue.id})">+ Ajouter un module</button>
                </div>
            </div>
        `;
    }

    // ─── Render un Module ───────────────────────────────
    function renderProfSelectOptions(mod) {
        const selected = new Set(mod.teachers || []);
        const allNames = sortTeachers(
            [...new Set([...teachersList, ...(mod.teachers || [])])]
        );
        return allNames.map(name =>
            `<option value="${escAttr(name)}"${selected.has(name) ? ' selected' : ''}>${esc(name)}</option>`
        ).join('');
    }

    function renderModule(mod, ueId) {
        return `
            <div class="param-module" data-module-id="${mod.id}">
                <div class="param-module-name">
                    <input type="text" value="${esc(mod.name)}" placeholder="Nom du module"
                           onblur="renameModule(${mod.id}, this.value, ${ueId})"
                           onkeydown="if(event.key==='Enter'){this.blur();}">
                </div>
                <div class="param-module-modalite">
                    <label class="param-checkbox-label">
                        <input type="checkbox" ${mod.one_teacher_in_list ? 'checked' : ''}
                               onchange="toggleChoixEnseignant(${mod.id}, this.checked, ${ueId})">
                        <span>1 seul enseignant parmi la liste</span>
                    </label>
                </div>
                <div class="param-module-profs">
                    <select class="param-profs-select" multiple="multiple"
                            data-module-id="${mod.id}" data-ue-id="${ueId}"
                            aria-label="Professeurs du module">
                        ${renderProfSelectOptions(mod)}
                    </select>
                </div>
                <button class="param-btn-remove" onclick="removeModule(${mod.id}, ${ueId})" title="Supprimer le module">&times;</button>
            </div>
        `;
    }

    // ─── Sélection des profs (Select2) ──────────────────
    function updateModuleTeachers(modId, ueId, values) {
        const ue = ues.find(u => u.id === ueId);
        if (!ue) return;
        const mod = (ue.modules || []).find(m => m.id === modId);
        if (!mod) return;

        mod.teachers = values;

        // Un nom saisi qui n'existait pas encore devient un nouveau prof,
        // disponible ensuite pour tous les modules.
        let listChanged = false;
        values.forEach((name) => {
            if (!teachersList.includes(name)) {
                teachersList.push(name);
                listChanged = true;
            }
        });

        if (listChanged) {
            teachersList = sortTeachers(teachersList);
            renderUEs();
        }
    }

    function initProfSelects() {
        if (typeof $ === 'undefined' || !$.fn || !$.fn.select2) return;

        document.querySelectorAll('.param-profs-select').forEach((el) => {
            const $el = $(el);
            if ($el.data('select2')) {
                $el.select2('destroy');
            }
            $el.select2({
                width: '100%',
                tags: true,
                language: 'fr',
                placeholder: 'Sélectionner ou ajouter un professeur',
                allowClear: true,
                theme: 'default',
            });
            $el.on('change', function () {
                const modId = Number(this.dataset.moduleId);
                const ueId = Number(this.dataset.ueId);
                const values = Array.from(this.selectedOptions).map((o) => o.value).filter(Boolean);
                updateModuleTeachers(modId, ueId, values);
            });
        });
    }

    function renameUE(ueId, newName) {
        if (!newName || !newName.trim()) return;
        const ue = ues.find(u => u.id === ueId);
        if (ue) ue.name = newName.trim();
    }

    function removeUE(ueId) {
        if (!confirm('Supprimer cette UE et tous ses modules ?')) return;
        ues = ues.filter(u => u.id !== ueId);
        renderUEs();
    }

    // ─── Actions Module ─────────────────────────────────
    function addModule(ueId) {
        const ue = ues.find(u => u.id === ueId);
        if (!ue) return;
        const newId = ++nextModuleId;
        if (!ue.modules) ue.modules = [];
        ue.modules.push({
            id: newId,
            name: 'Nouveau module '+newId,
            ue_id: ueId,
            one_teacher_in_list: false,
            teachers: []
        });
        ue._open = true;
        renderUEs();
    }

    function renameModule(modId, newName, ueId) {
        if (!newName || !newName.trim()) return;
        const ue = ues.find(u => u.id === ueId);
        if (!ue) return;
        const mod = (ue.modules || []).find(m => m.id === modId);
        if (mod) mod.name = newName.trim();
    }

    function toggleChoixEnseignant(modId, checked, ueId) {
        const ue = ues.find(u => u.id === ueId);
        if (!ue) return;
        const mod = (ue.modules || []).find(m => m.id === modId);
        if (mod) mod.one_teacher_in_list = checked;
    }

    function removeModule(modId, ueId) {
        if (!confirm('Supprimer ce module ?')) return;
        const ue = ues.find(u => u.id === ueId);
        if (!ue) return;
        ue.modules = (ue.modules || []).filter(m => m.id !== modId);
        ue._open = true;
        renderUEs();
    }

</script>

<div id="param-ue-container">
    <p class="param-empty">Aucune UE pour cette filière.</p>
    <button class="param-btn-add param-btn-add-ue" onclick="addUE()">+ Ajouter une UE</button>
</div>
