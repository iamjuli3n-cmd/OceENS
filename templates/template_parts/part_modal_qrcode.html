<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    /* --- THE MODAL OVERLAY --- */
    .modal {
        display: none;
        /* Hidden by default */
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        /* Dimmed background */

        /* FLEXBOX: This is the magic that centers the content */
        display: none;
        /* JS will switch this to 'flex' */
        justify-content: center;
        align-items: center;

        /* Animation for the background fade */
        animation: fadeIn 0.3s ease-out;
    }

    /* --- THE FLOATING CONTENT BOX --- */
    .modal-content {
        background-color: #fff;
        padding: 30px;
        border-radius: 15px;
        width: 300px;
        text-align: center;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        /* Stronger shadow for "floating" effect */

        /* Animation for the box scaling up */
        animation: popUp 0.3s ease-out;
    }

    /* Close Button */
    .close-btn {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        color: #aaa;
    }

    .close-btn:hover {
        color: #333;
    }

    #qrcode-container {
        display: flex;
        justify-content: center;
        margin-top: 15px;
    }

    /* --- ANIMATIONS --- */
    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes popUp {
        from {
            transform: scale(0.7);
            opacity: 0;
        }

        to {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>


<!-- The Modal -->
<div id="qrModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 style="margin: 0 0 10px 0;" id="qrcode-title"></h3>
        <h4 style="margin: 0 0 10px 0;" id="qrcode-subtitle"></h4>
        <div id="qrcode-container"></div>
        <p style="font-size: 12px; color: #666; margin-top: 15px;">Scan the code with your phone</p>
    </div>
</div>

<script type="text/javascript">
    function openQRCodeModal(url, title, subtitle) {
        const container = document.getElementById("qrcode-container");
        const modal = document.getElementById("qrModal");
        document.getElementById("qrcode-title").innerText = title;
        document.getElementById("qrcode-subtitle").innerText = subtitle;

        // Clear previous QR
        container.innerHTML = "";

        // Generate new QR
        new QRCode(container, {
            text: url,
            width: 200,
            height: 200
        });

        // IMPORTANT: Set display to 'flex' instead of 'block' 
        // This activates the centering logic in our CSS
        modal.style.display = "flex";
    }

    function closeModal() {
        document.getElementById("qrModal").style.display = "none";
    }

    // Close when clicking the dark overlay
    window.onclick = function (event) {
        const modal = document.getElementById("qrModal");
        if (event.target == modal) {
            closeModal();
        }
    }
</script>
