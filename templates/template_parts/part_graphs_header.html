<script src="https://code.highcharts.com/highcharts.js"></script>
<script>
    function renderAnswerChart(dataSourceId, containerId, chartType = 'bar') {
        
        const source = document.getElementById(dataSourceId);
        console.log(source.text);
        if (!source || typeof Highcharts === 'undefined') return;

        const payload = JSON.parse(source.textContent);
        if (chartType === 'pie' && payload.allow_pie === false) chartType = 'bar';
        const items = payload.items || [];
        const displayMode = payload.mode || 'percent';
        const countLabel = payload.count_label || 'réponse(s)';
        const seriesName = payload.series_name || 'Réponses';
        const axisTitle = payload.axis_title || 'Nombre de réponses';
        const total = items.reduce((sum, item) => sum + (item.count || 0), 0);
        const percentageDenominator = payload.percentage_denominator ?? total;
        const positiveColors = ['#5dbb47', '#91c83e', '#c7d93a'];
        const negativeColors = ['#f1ac16', '#ea761f', '#f02024'];
        const neutralColors = ['#470a68', '#7350a3', '#4b83c3', '#5fa8a5', '#8a8f98'];
        let positiveIndex = 0;
        let negativeIndex = 0;
        let neutralIndex = 0;

        const enriched = items.map(item => {
            let color;
            if (item.is_positive === true) {
                color = positiveColors[positiveIndex++ % positiveColors.length];
            } else if (item.is_positive === false) {
                color = negativeColors[negativeIndex++ % negativeColors.length];
            } else {
                color = neutralColors[neutralIndex++ % neutralColors.length];
            }
            return { ...item, color };
        });

        const seriesData = enriched
            .filter(item => chartType !== 'pie' || item.count > 0)
            .map(item => chartType === 'pie'
                ? { name: item.label, y: item.count, color: item.color }
                : {
                    name: item.label,
                    y: displayMode === 'count'
                        ? item.count
                        : (percentageDenominator ? 100 * item.count / percentageDenominator : 0),
                    rawCount: item.count,
                    color: item.color
                });

        const common = {
            title: { text: payload.title || '', align: 'left', style: { fontSize: '15px' } },
            credits: { enabled: false },
            legend: { enabled: false },
            series: [{ name: seriesName, data: seriesData }]
        };

        const specific = chartType === 'pie' ? {
            chart: { type: 'pie', height: Math.max(260, enriched.length * 42) },
            tooltip: { pointFormat: `<b>{point.y}</b> ${countLabel} — {point.percentage:.0f}%` },
            plotOptions: { pie: { dataLabels: { format: '<b>{point.name}</b>: {point.percentage:.0f}%' } } }
        } : {
            chart: { type: 'bar', height: Math.max(240, enriched.length * 46) },
            xAxis: { categories: enriched.map(item => item.label), title: { text: null } },
            yAxis: {
                min: 0,
                max: displayMode === 'count' ? null : 100,
                title: { text: displayMode === 'count' ? axisTitle : null },
                labels: { format: displayMode === 'count' ? '{value:.0f}' : '{value:.0f}%' }
            },
            tooltip: {
                formatter: function () {
                    const suffix = displayMode === 'count' ? '' : ` — ${this.y.toFixed(0)}%`;
                    return `<b>${this.point.name}</b><br>${this.point.rawCount} ${countLabel}${suffix}`;
                }
            },
            plotOptions: {
                bar: {
                    dataLabels: {
                        enabled: true,
                        format: displayMode === 'count' ? '{y:.0f}' : '{y:.0f}%'
                    }
                }
            }
        };

        Highcharts.chart(containerId, Object.assign({}, common, specific));
    }

    function toggleDetail(rank) {
        const element = document.getElementById(`detailled-section-${rank}`);
        if (!element) return;
        element.style.display = element.style.display === 'block' ? 'none' : 'block';
    }
</script>
