<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramétrage - OCEENS II</title>
    <meta name="description" content="Paramétrage des sondages OCEENS II">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script type="text/javascript" src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/survey_create.css">
</head>

<body>


    <header>
        <div class="header-left">
            <img src="/static/img/epf_logo_blanc.png" alt="EPF">
            <a href="/" class="btn-retour">Retour</a>
        </div>
        <div class="header-right">
            <span class="header-logo-oceens">
                <span style="color: #df231d;">Océ</span><span style="color: #470a68;">Ens</span>
            </span>
        </div>
    </header>



    <main>
        <div class="card">

            <h2>Paramétrage du sondage</h2>
            <div id="parametrage-container">
                <div class="pub-header">
                    <div class="pub-field">
                        <label>Modèle de questions</label>
                        <select id="param-template">
                            {% for template in survey_templates %}
                            <option value="{{ template.template_id }}">{{ template.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="pub-field">
                        <label>Semestre</label>
                        <select id="param-semestre">
                            <option value="" selected>-- Sélectionnez un semestre --</option>
                            {% for s in ['Automne','Printemps'] %}
                            <option value="{{ s }}">{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="pub-field">
                        {% include 'template_parts/part_select_school_year.html' %}
                    </div>
                </div>

                <hr style="border:0; border-top:1px solid #e0e6ec; margin:20px 0;">

                <div class="param-selectors">
                    <div class="param-field">
                        <label>Filière </label>
                        <div class="param-select-group">
                            <select id="param-filiere">
                                {% for program in programs %}
                                <option value="{{ program.code }}">{{ program.name }} ({{ program.campus }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                {% include 'template_parts/part_add_ues_and_modules.html' %}

                {% include 'template_parts/part_students_dropzone.html' %}

                {% include 'template_parts/part_publish_survey.html' %}

            </div>
        </div>
    </main>



    <!--<script src="/static/js/survey_create.js"></script>-->

</body>

</html>
